name: Build BunnyTL APK

on:
  workflow_dispatch:
    inputs:
      zip:
        description: "Nama file ZIP proyek"
        required: true
        default: "Mangatl tahap2.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract BunnyTL project
        run: unzip -q -o "${{ github.event.inputs.zip }}" -d proj

      - name: Build BunnyTL APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BUNNYTL_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > bunnytl-release.jks

      - name: Sign BunnyTL APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUNNYTL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUNNYTL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUNNYTL_KEY_PASSWORD }}
        run: |
          APK="proj/app/build/outputs/apk/debug/app-debug.apk"
          BT_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT_VERSION/apksigner"

          "$APKSIGNER" sign \
            --ks bunnytl-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            "$APK"

          "$APKSIGNER" verify "$APK"

          rm -f bunnytl-release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: BunnyTL-debug-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
