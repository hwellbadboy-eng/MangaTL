name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip:
        description: "Nama file ZIP proyek"
        required: true
        default: "BunnyTL_tahap13.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.4"

      - name: Extract project
        run: unzip -q -o "${{ github.event.inputs.zip }}" -d proj

      - name: Unduh sherpa-onnx (suara offline)
        run: |
          mkdir -p proj/app/libs
          curl -fL --retry 3 -o proj/app/libs/sherpa-onnx-2.0.1.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          ls -la proj/app/libs

      - name: Build APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Siapkan keystore
        env:
          KS_B64: ${{ secrets.BUNNYTL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "Secret BUNNYTL_KEYSTORE_BASE64 kosong atau tidak terbaca"; exit 1
          fi
          echo "$KS_B64" | base64 -d > keystore.jks
          ls -la keystore.jks

      - name: Tanda tangani APK
        env:
          KS_PASS: ${{ secrets.BUNNYTL_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.BUNNYTL_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.BUNNYTL_KEY_ALIAS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign \
            --ks keystore.jks \
            --ks-pass env:KS_PASS \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass env:KEY_PASS \
            --out BunnyTL-signed.apk \
            proj/app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify --print-certs BunnyTL-signed.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: BunnyTL-signed-apk
          path: BunnyTL-signed.apk
