name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip:
        description: "Nama file ZIP proyek"
        required: true
        default: "BunnyTL tahap3.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: unzip -q -o "${{ github.event.inputs.zip }}" -d proj

      - name: Build APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Siapkan keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > keystore.jks
          elif [ -f bunnytl.jks ]; then
            cp bunnytl.jks keystore.jks
          else
            echo "Keystore tidak ditemukan (secret KEYSTORE_BASE64 atau file bunnytl.jks)"; exit 1
          fi

      - name: Tanda tangani APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign \
            --ks keystore.jks \
            --ks-pass env:KS_PASS \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass env:KEY_PASS \
            --out BunnyTL-signed.apk \
            proj/app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify --print-certs BunnyTL-signed.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: BunnyTL-signed-apk
          path: BunnyTL-signed.apk
