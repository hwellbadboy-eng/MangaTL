
name: Build BunnyTL APK

on:
  workflow_dispatch:
    inputs:
      zip:
        description: "Nama file ZIP proyek"
        required: true
        default: "Mangatl tahap2.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract BunnyTL project
        id: extract
        shell: bash
        run: |
          mkdir -p proj

          ZIP="${{ github.event.inputs.zip }}"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP tidak ditemukan: $ZIP"
            echo "Daftar file:"
            find . -maxdepth 2 -type f
            exit 1
          fi

          unzip -q -o "$ZIP" -d proj

          SETTINGS_FILE="$(find proj -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name settings.gradle.dcl \
          \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: File Gradle tidak ditemukan dalam ZIP!"
            find proj -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project ditemukan: $PROJECT_DIR"

      - name: Build BunnyTL APK
        run: |
          gradle -p "${{ steps.extract.outputs.project_dir }}" assembleDebug --no-daemon --stacktrace

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BUNNYTL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret BUNNYTL_KEYSTORE_BASE64 kosong!"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > bunnytl-release.jks

      - name: Sign BunnyTL APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.BUNNYTL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUNNYTL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUNNYTL_KEY_PASSWORD }}
        run: |
          APK="${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "APK tidak ditemukan: $APK"
            exit 1
          }

          BT_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT_VERSION/apksigner"

          "$APKSIGNER" sign \
            --ks bunnytl-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            "$APK"

          "$APKSIGNER" verify "$APK"

          rm -f bunnytl-release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: BunnyTL-debug-apk
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
