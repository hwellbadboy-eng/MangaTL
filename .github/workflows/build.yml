name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip:
        description: "Nama file ZIP proyek"
        required: true
        default: "BunnyTL tahap3.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: unzip -q -o "${{ github.event.inputs.zip }}" -d proj

      - name: Build APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Siapkan keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > keystore.jks
          else
            F=$(find . -maxdepth 1 -type f \( -iname '*.jks' -o -iname '*.keystore' -o -iname '*.p12' -o -iname '*.pfx' \) | head -1)
            if [ -z "$F" ]; then echo "Tidak ada file keystore di root repo"; ls -la; exit 1; fi
            echo "Pakai keystore: $F"
            cp "$F" keystore.jks
          fi

      - name: Tanda tangani APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign \
            --ks
